name: GX Studio beta packages

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: linux-x64
          - runner: windows-2022
            target: windows-x64
          - runner: macos-15
            target: macos-arm64
          - runner: macos-15-intel
            target: macos-x64
    runs-on: ${{ matrix.runner }}
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/release-requirements.txt
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libopengl0 libpulse0 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0
      - name: Install dependencies
        run: python -m pip install -r tools/release-requirements.txt .
      - name: Run tests
        run: python -m unittest discover -s tests
      - name: Build portable folder
        run: python tools/package_studio.py
      - name: Verify relocated application and archive
        run: python tools/release_archive.py "${{ matrix.target }}" "${{ github.ref_name }}"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/gx-studio-*
          if-no-files-found: error
  publish:
    if: github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true
      - name: Publish beta
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd release && sha256sum gx-studio-* > SHA256SUMS.txt)
          gh release create "$GITHUB_REF_NAME" release/* --verify-tag --prerelease \
            --title "GX Studio $GITHUB_REF_NAME — Beta" --notes-file docs/beta-release.md
