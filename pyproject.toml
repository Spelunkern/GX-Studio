[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "shaiya-gx-studio"
version = "0.1.0b1"
description = "Desktop editor for Shaiya GX data"
readme = "README.md"
requires-python = ">=3.11"
license = "BSD-3-Clause"
license-files = ["LICENSE", "licenses/*.txt"]
dependencies = ["PySide6>=6.8,<7", "psutil>=5.9,<8", "numpy>=1.26,<3", "Pillow>=10,<14"]

[project.gui-scripts]
gx-studio = "gx_items.app:main"

[project.urls]
Homepage = "https://github.com/Spelunkern/GX-Studio"
Issues = "https://github.com/Spelunkern/GX-Studio/issues"
Releases = "https://github.com/Spelunkern/GX-Studio/releases"
Shaiya-GX = "https://github.com/Spelunkern/Shaiya-GX"

[tool.setuptools.packages.find]
include = ["gx_items*"]

[tool.setuptools.package-data]
gx_items = ["resources/*.ico", "resources/*.png"]
